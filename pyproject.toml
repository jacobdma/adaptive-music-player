[project]
name = "music-algo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mutagen>=1.47",
]

[project.scripts]
music-algo = "music_algo.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["music_algo*"]
