[project]
name = "adaptive-music-player"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mutagen>=1.47",
    "mpv>=1.0",
    "numpy>=2.0",
    "librosa>=0.11",
    "scikit-learn>=1.5",
    "torch>=2.6",
    "transformers>=4.45",
]

[project.scripts]
adaptive-music-player = "adaptive_music_player.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adaptive_music_player*"]
