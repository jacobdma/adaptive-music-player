[project]
name = "adaptive-music-player"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mutagen>=1.47",
    "mpv>=1.0",
]

[project.scripts]
adaptive-music-player = "adaptive_music_player.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adaptive_music_player*"]
